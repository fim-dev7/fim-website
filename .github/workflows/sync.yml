name: Sync FiM transcripts to Algolia
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/sync.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: 6b8eaa63fd4a94a6bf742013c1b87238d20fb9dd
          ALGOLIA_APP_ID: G2C3CUY2G8
          ALGOLIA_ADMIN_KEY: 2698cccbb1a68877d22cf2cc309aac62
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync episodes from Google Drive'
          file_pattern: 'settings.json'
