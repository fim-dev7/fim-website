name: Sync FiM site from Google Sheets + Drive
on:
  # Re-enabled 2026-05-31 after the full archive + Drive Docs were corrected.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node scripts/sync.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          
      - id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync site from Google Sheets + Drive'
          # NOTE: file_pattern must be a SINGLE LINE, space-separated. Multi-line
          # YAML (using "|") only matches the first line.
          file_pattern: 'settings.json data.jsx index.html episodes/index.html episodes/*/index.html topics/index.html topics/*/index.html questions/index.html questions/*/index.html sitemap.xml robots.txt llms.txt qa-index.json'

      # Push the (re)generated URLs to IndexNow (Bing/Yandex/etc.) — only when the
      # sync actually changed files, so we don't re-ping the same URLs every 6h.
      - name: Ping IndexNow
        if: steps.autocommit.outputs.changes_detected == 'true'
        run: node scripts/indexnow-submit.js
