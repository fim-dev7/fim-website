name: Sync FiM transcripts to Algolia
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/sync.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: REDACTED_PLACEHOLDER
          ALGOLIA_APP_ID: G2C3CUY2G8
          ALGOLIA_ADMIN_KEY: REDACTED_ALGOLIA_ADMIN_KEY_ROTATED_2026_05_30
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync episodes from Google Drive'
          file_pattern: 'settings.json'
