name: Sync FiM site from Google Sheets + Drive
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node scripts/sync.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync site from Google Sheets + Drive'
          # NOTE: file_pattern must be a SINGLE LINE, space-separated. Multi-line
          # YAML (using "|") only matches the first line.
          file_pattern: 'settings.json data.jsx index.html episodes/index.html episodes/*/index.html topics/index.html topics/*/index.html questions/index.html questions/*/index.html sitemap.xml robots.txt llms.txt embeddings.json'
